name: RECLAIM CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RECLAIM_ENVIRONMENT: ci
  RECLAIM_RUN_MODE: replay
  RECLAIM_REPLAY_LABEL: replay
  RECLAIM_LIVE_ACTIONS_ENABLED: "false"
  RECLAIM_LIVE_FINANCIAL_ACTIONS_ENABLED: "false"
  RECLAIM_PROVIDER_AVAILABLE: "false"
  RECLAIM_CONNECTOR_AVAILABLE: "false"
  RECLAIM_PROVIDER_QUALIFIED: "false"
  RECLAIM_CONNECTOR_QUALIFIED: "false"
  RECLAIM_LIVE_EXECUTION_OCCURRED: "false"

jobs:
  python-quality:
    name: Python quality and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend test tooling
        run: python -m pip install --disable-pip-version-check -e "backend[test,dev]"
      - name: Ruff lint
        run: python -m ruff check backend packages tests
      - name: Ruff format
        run: python -m ruff format --check backend packages tests
      - name: Python type check
        run: python -m mypy backend/app backend/agent backend/replay packages
      - name: Compile Python sources
        run: python -m compileall -q backend packages tests
      - name: Unit, property, and contract tests
        run: python -m pytest tests/unit tests/property tests/contract -q

  frontend-quality:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Frontend tests
        run: npm test -- --run
      - name: Production build
        run: npm run build

  integration-and-acceptance:
    name: Integration, migration, Compose, and acceptance boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend test tooling
        run: python -m pip install --disable-pip-version-check -e "backend[test,dev]"
      - name: Validate Compose configuration
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.test.yml -f infra/networks.yml config --quiet
      - name: Compose topology boundary
        run: python -m pytest tests/integration/test_compose_topology.py -q
      - name: Migration and repository checks
        run: python -m pytest tests/unit -k migration -q
      - name: Integration tests
        run: python -m pytest tests/integration -q
      - name: Acceptance tests
        run: python -m pytest tests/acceptance tests/browser -q
      - name: Build provenance
        run: python scripts/build_provenance.py
      - name: Diff hygiene
        run: git diff --check

  source-built-deployment:
    name: Source-built REPLAY deployment smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose -p reclaim-ci -f infra/docker-compose.yml config --quiet
      - name: Build local API and web images
        run: docker compose -p reclaim-ci -f infra/docker-compose.yml build api web
      - name: Start fresh low-RAM demo
        run: docker compose -p reclaim-ci -f infra/docker-compose.yml up -d --no-build --wait --wait-timeout 180 postgres api web
      - name: Verify API, same-origin browser route, and safe mode
        run: |
          curl --fail --silent http://127.0.0.1:8000/health/ready > /tmp/reclaim-health.json
          curl --fail --silent http://127.0.0.1:3000/tenants/tenant-canonical-demo/cases/case-canonical-demo-001/operator-view > /tmp/reclaim-view.json
          python - <<'PY'
          import json
          health = json.load(open('/tmp/reclaim-health.json', encoding='utf-8'))
          view = json.load(open('/tmp/reclaim-view.json', encoding='utf-8'))
          assert health['status'] == 'ready'
          assert health['mode'] == 'replay'
          assert health['live_actions_enabled'] is False
          assert view['case']['case_id'] == 'case-canonical-demo-001'
          assert view['read_only'] is True
          assert view['authoritative'] is False
          assert view['remote_side_effects'] == []
          PY
      - name: Verify fresh migration completion
        run: |
          ! docker logs reclaim-ci-postgres-1 2>&1 | grep -q 'ERROR:'
          docker exec reclaim-ci-postgres-1 psql -v ON_ERROR_STOP=1 -U reclaim -d reclaim -Atc "SELECT 'ok' WHERE to_regclass('public.webhook_deliveries') IS NOT NULL AND to_regclass('public.action_executions') IS NOT NULL AND EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'verifications_execution_resource_fkey');" | grep -qx ok
      - name: Show deployment logs on failure
        if: failure()
        run: docker compose -p reclaim-ci -f infra/docker-compose.yml logs --no-color
      - name: Stop deployment
        if: always()
        run: docker compose -p reclaim-ci -f infra/docker-compose.yml down --volumes --remove-orphans

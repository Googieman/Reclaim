name: RECLAIM Evaluation Controls

on:
  workflow_dispatch:
  pull_request:
    paths:
      - evaluation/**
      - backend/replay/**
      - tests/evaluation/**
      - tests/contract/test_replay_evaluation.py
      - tests/integration/test_canonical_replay.py
      - tests/integration/test_replay_variants.py

permissions:
  contents: read

env:
  RECLAIM_ENVIRONMENT: ci-evaluation
  RECLAIM_RUN_MODE: replay
  RECLAIM_REPLAY_LABEL: replay
  RECLAIM_LIVE_ACTIONS_ENABLED: "false"
  RECLAIM_LIVE_FINANCIAL_ACTIONS_ENABLED: "false"
  RECLAIM_PROVIDER_AVAILABLE: "false"
  RECLAIM_CONNECTOR_AVAILABLE: "false"
  RECLAIM_PROVIDER_QUALIFIED: "false"
  RECLAIM_CONNECTOR_QUALIFIED: "false"
  RECLAIM_LIVE_EXECUTION_OCCURRED: "false"

jobs:
  replay-evaluation:
    name: Replay, sealed-data, and provenance controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend test tooling
        run: python -m pip install --disable-pip-version-check -e "backend[test,dev]"
      - name: Validate evaluation and replay contracts
        run: python -m pytest tests/evaluation tests/contract/test_replay_evaluation.py -q
      - name: Run deterministic replay regressions
        run: python -m pytest tests/integration/test_canonical_replay.py tests/integration/test_replay_variants.py tests/integration/test_model_replay_fallback.py -q
      - name: Enforce sealed held-out access controls
        run: python -m pytest evaluation/tests -q
      - name: Confirm manifest is honest and held-out data is not exposed
        run: |
          python -c "from pathlib import Path; t=Path('evaluation/manifest.yaml').read_text(); assert 'case_count: 0' in t; assert 'available_case_count: 0' in t; assert 'held_out_sealed: true' in t; assert 'generated_case_count: 0' in t; print('evaluation manifest controls passed')"
      - name: Record artifact provenance
        run: python scripts/build_provenance.py
      - name: Diff hygiene
        run: git diff --check

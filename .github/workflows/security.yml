name: RECLAIM Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RECLAIM_ENVIRONMENT: ci-security
  RECLAIM_RUN_MODE: replay
  RECLAIM_REPLAY_LABEL: replay
  RECLAIM_LIVE_ACTIONS_ENABLED: "false"
  RECLAIM_LIVE_FINANCIAL_ACTIONS_ENABLED: "false"
  RECLAIM_PROVIDER_AVAILABLE: "false"
  RECLAIM_CONNECTOR_AVAILABLE: "false"
  RECLAIM_PROVIDER_QUALIFIED: "false"
  RECLAIM_CONNECTOR_QUALIFIED: "false"
  RECLAIM_LIVE_EXECUTION_OCCURRED: "false"

jobs:
  security-boundaries:
    name: Security and least-privilege boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend test tooling
        run: python -m pip install --disable-pip-version-check -e "backend[test,dev]"
      - name: Security tests
        run: python -m pytest tests/security -q
      - name: Replay and action safety regressions
        run: python -m pytest tests/contract/test_action_gateway_state.py tests/integration/test_replay_variants.py tests/integration/test_action_terminal_outcomes.py -q
      - name: Python lint and compile checks
        run: |
          python -m ruff check backend packages tests
          python -m compileall -q backend packages tests
      - name: Validate safe Compose configuration
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.test.yml -f infra/networks.yml config --quiet
      - name: Workflow and policy formatting
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - run: npx --yes prettier@3.4.2 --check .github/workflows/*.yml
      - name: Diff hygiene
        run: git diff --check

name: reclaim-production

# Production is an explicit overlay. It requires the deployment secret manager
# to provide the broker certificate directory and all values marked REQUIRED;
# this file intentionally contains no credential material or live-action switch.
services:
  web:
    image: ${RECLAIM_WEB_IMAGE:?RECLAIM_WEB_IMAGE is required}

  api:
    image: ${RECLAIM_API_IMAGE:?RECLAIM_API_IMAGE is required}
    environment:
      RECLAIM_ENVIRONMENT: production
      RECLAIM_KEYCLOAK_ISSUER: https://${KEYCLOAK_HOSTNAME:?KEYCLOAK_HOSTNAME is required}/realms/reclaim
      RECLAIM_OIDC_AUDIENCE: ${RECLAIM_OIDC_AUDIENCE:?RECLAIM_OIDC_AUDIENCE is required}
      RECLAIM_OIDC_JWKS_URL: ${RECLAIM_OIDC_JWKS_URL:?RECLAIM_OIDC_JWKS_URL is required}
      RECLAIM_VAULT_ADDRESS: ${RECLAIM_VAULT_ADDRESS:?RECLAIM_VAULT_ADDRESS is required}
      RECLAIM_REDPANDA_SECURITY_PROTOCOL: SASL_SSL
      RECLAIM_REDPANDA_SASL_MECHANISM: SCRAM-SHA-512
      RECLAIM_REDPANDA_SASL_USERNAME: ${RECLAIM_REDPANDA_SASL_USERNAME:?RECLAIM_REDPANDA_SASL_USERNAME is required}
      RECLAIM_REDPANDA_SASL_PASSWORD_FILE: /run/secrets/redpanda-sasl-password
      RECLAIM_REDPANDA_TLS_CA_FILE: /run/secrets/redpanda-ca
      RECLAIM_REDPANDA_TLS_CERT_FILE: /run/secrets/redpanda-client-cert
      RECLAIM_REDPANDA_TLS_KEY_FILE: /run/secrets/redpanda-client-key
      RECLAIM_LIVE_ACTIONS_ENABLED: "false"
      RECLAIM_LIVE_FINANCIAL_ACTIONS_ENABLED: "false"
      RECLAIM_RPO_MINUTES: ${RECLAIM_RPO_MINUTES:?RECLAIM_RPO_MINUTES is required}
      RECLAIM_RTO_MINUTES: ${RECLAIM_RTO_MINUTES:?RECLAIM_RTO_MINUTES is required}
      RECLAIM_BACKUP_RETENTION_DAYS: ${RECLAIM_BACKUP_RETENTION_DAYS:?RECLAIM_BACKUP_RETENTION_DAYS is required}
    secrets:
      - redpanda-ca
      - redpanda-client-cert
      - redpanda-client-key
      - redpanda-sasl-password

  event-relay:
    profiles: [production]
    image: ${RECLAIM_API_IMAGE:?RECLAIM_API_IMAGE is required}
    environment:
      RECLAIM_ENVIRONMENT: production
      RECLAIM_REDPANDA_SECURITY_PROTOCOL: SASL_SSL
      RECLAIM_REDPANDA_SASL_MECHANISM: SCRAM-SHA-512
      RECLAIM_REDPANDA_SASL_USERNAME: ${RECLAIM_REDPANDA_SASL_USERNAME:?RECLAIM_REDPANDA_SASL_USERNAME is required}
      RECLAIM_REDPANDA_SASL_PASSWORD_FILE: /run/secrets/redpanda-sasl-password
      RECLAIM_REDPANDA_TLS_CA_FILE: /run/secrets/redpanda-ca
      RECLAIM_REDPANDA_TLS_CERT_FILE: /run/secrets/redpanda-client-cert
      RECLAIM_REDPANDA_TLS_KEY_FILE: /run/secrets/redpanda-client-key
    secrets:
      - redpanda-ca
      - redpanda-client-cert
      - redpanda-client-key
      - redpanda-sasl-password

  redis:
    profiles: [production]

  n8n-main:
    profiles: [production]
    environment:
      N8N_PROTOCOL: https
      N8N_HOST: ${N8N_HOST:?N8N_HOST is required}
      N8N_EDITOR_BASE_URL: https://${N8N_HOST:?N8N_HOST is required}
      N8N_SECURE_COOKIE: "true"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      N8N_SSL_CERT: /run/secrets/n8n-tls-cert
      N8N_SSL_KEY: /run/secrets/n8n-tls-key
      RECLAIM_N8N_SERVICE_TOKEN: ${RECLAIM_N8N_SERVICE_TOKEN:?RECLAIM_N8N_SERVICE_TOKEN is required}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?N8N_DB_PASSWORD is required}
    secrets:
      - n8n-tls-cert
      - n8n-tls-key

  n8n-worker:
    profiles: [production]
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      RECLAIM_N8N_SERVICE_TOKEN: ${RECLAIM_N8N_SERVICE_TOKEN:?RECLAIM_N8N_SERVICE_TOKEN is required}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?N8N_DB_PASSWORD is required}

  keycloak:
    profiles: [production]
    command: ["start", "--optimized"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:?KEYCLOAK_DB_USERNAME is required}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:?KEYCLOAK_HOSTNAME is required}
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_CERTIFICATE_FILE: /run/secrets/keycloak-tls-cert
      KC_HTTPS_CERTIFICATE_KEY_FILE: /run/secrets/keycloak-tls-key
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_IMPORT: /opt/keycloak/data/import/realm-reclaim.json
    volumes:
      - ./keycloak/realm-reclaim.json:/opt/keycloak/data/import/realm-reclaim.json:ro
    secrets:
      - keycloak-tls-cert
      - keycloak-tls-key

  vault:
    profiles: [production]
    command: ["server", "-config=/vault/config/production.hcl"]
    environment:
      VAULT_ADDR: https://vault:8200
    volumes:
      - ./vault/production.hcl:/vault/config/production.hcl:ro
      - vault-data:/vault/file
    secrets:
      - vault-tls-cert
      - vault-tls-key

  redpanda:
    profiles: [production]
    command:
      - redpanda
      - start
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9092
      - --set
      - redpanda.enable_sasl=true
      - --set
      - redpanda.kafka_enable_authorization=true
      - --set
      - redpanda.kafka_api[0].authentication_method=sasl
      - --set
      - redpanda.kafka_api[0].tls.enabled=true
      - --set
      - redpanda.kafka_api[0].tls.require_client_auth=true
      - --set
      - redpanda.kafka_api[0].tls.cert_file=/etc/redpanda/tls/server.crt
      - --set
      - redpanda.kafka_api[0].tls.key_file=/etc/redpanda/tls/server.key
      - --set
      - redpanda.kafka_api[0].tls.truststore_file=/etc/redpanda/tls/ca.pem
    volumes:
      - redpanda-data:/var/lib/redpanda/data
      - ./redpanda/production-security.yaml:/etc/redpanda/production-security.yaml:ro
      - ./redpanda/production-acl.yaml:/etc/redpanda/production-acl.yaml:ro
      - ${RECLAIM_REDPANDA_TLS_DIR:?RECLAIM_REDPANDA_TLS_DIR is required}/ca.pem:/etc/redpanda/tls/ca.pem:ro
      - ${RECLAIM_REDPANDA_TLS_DIR:?RECLAIM_REDPANDA_TLS_DIR is required}/server.crt:/etc/redpanda/tls/server.crt:ro
      - ${RECLAIM_REDPANDA_TLS_DIR:?RECLAIM_REDPANDA_TLS_DIR is required}/server.key:/etc/redpanda/tls/server.key:ro
    environment:
      REDPANDA_TLS_CA_FILE: /etc/redpanda/tls/ca.pem
      REDPANDA_TLS_CERT_FILE: /etc/redpanda/tls/server.crt
      REDPANDA_TLS_KEY_FILE: /etc/redpanda/tls/server.key
      REDPANDA_ACL_POLICY_FILE: /etc/redpanda/production-acl.yaml

secrets:
  redpanda-ca:
    file: ${RECLAIM_REDPANDA_TLS_DIR:?RECLAIM_REDPANDA_TLS_DIR is required}/ca.pem
  redpanda-client-cert:
    file: ${RECLAIM_REDPANDA_TLS_DIR:?RECLAIM_REDPANDA_TLS_DIR is required}/client.crt
  redpanda-client-key:
    file: ${RECLAIM_REDPANDA_TLS_DIR:?RECLAIM_REDPANDA_TLS_DIR is required}/client.key
  redpanda-sasl-password:
    file: ${RECLAIM_SECRET_DIR:?RECLAIM_SECRET_DIR is required}/redpanda-sasl-password
  keycloak-tls-cert:
    file: ${RECLAIM_CONTROL_PLANE_TLS_DIR:?RECLAIM_CONTROL_PLANE_TLS_DIR is required}/keycloak.crt
  keycloak-tls-key:
    file: ${RECLAIM_CONTROL_PLANE_TLS_DIR:?RECLAIM_CONTROL_PLANE_TLS_DIR is required}/keycloak.key
  n8n-tls-cert:
    file: ${RECLAIM_CONTROL_PLANE_TLS_DIR:?RECLAIM_CONTROL_PLANE_TLS_DIR is required}/n8n.crt
  n8n-tls-key:
    file: ${RECLAIM_CONTROL_PLANE_TLS_DIR:?RECLAIM_CONTROL_PLANE_TLS_DIR is required}/n8n.key
  vault-tls-cert:
    file: ${RECLAIM_CONTROL_PLANE_TLS_DIR:?RECLAIM_CONTROL_PLANE_TLS_DIR is required}/vault.crt
  vault-tls-key:
    file: ${RECLAIM_CONTROL_PLANE_TLS_DIR:?RECLAIM_CONTROL_PLANE_TLS_DIR is required}/vault.key

volumes:
  redpanda-data:
    name: ${COMPOSE_PROJECT_NAME:-reclaim-production}-redpanda-data
  vault-data:
    name: ${COMPOSE_PROJECT_NAME:-reclaim-production}-vault-data

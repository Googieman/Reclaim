receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  # Correlation identifiers are safe bounded attributes for trace/log lookup;
  # raw narratives, payloads, and credentials are always deleted below.
  attributes/correlation:
    actions:
      - key: reclaim.correlation_id
        action: update
        from_attribute: reclaim.correlation_id
      - key: reclaim.case_id
        action: update
        from_attribute: reclaim.case_id
  attributes/redaction:
    actions:
      - key: reclaim.raw_payload
        action: delete
      - key: reclaim.authorization
        action: delete
      - key: reclaim.email
        action: delete
      - key: reclaim.phone
        action: delete

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/correlation, attributes/redaction, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [attributes/redaction, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [attributes/correlation, attributes/redaction, batch]
      exporters: [debug]

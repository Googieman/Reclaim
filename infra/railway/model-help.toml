# Private model service configuration. Do not attach a public domain or proxy
# this service directly to the browser. The authenticated model gateway is the
# only supported caller and must supply MODEL_API_KEY at deployment time.

[build]
dockerfilePath = "infra/model-help/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[volumes]]
name = "help-model-data"
mountPath = "/models"

[variables]
MODEL_PATH = "/models/deepseek-r1-distill-qwen-1.5b-q4_0.gguf"
MODEL_MANIFEST_PATH = "/etc/reclaim/help-model-manifest.json"
MODEL_FILENAME = "deepseek-r1-distill-qwen-1.5b-q4_0.gguf"
MODEL_REPOSITORY = "ggml-org/DeepSeek-R1-Distill-Qwen-1.5B-Q4_0-GGUF"

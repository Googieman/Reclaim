static_resources:
  listeners:
    - name: secret_api_mtls
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8443
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              require_client_certificate: true
              common_tls_context:
                tls_certificates:
                  - certificate_chain: {filename: /etc/secrets/broker-cert.pem}
                    private_key: {filename: /etc/secrets/broker-key.pem}
                validation_context:
                  trusted_ca: {filename: /etc/secrets/broker-ca.pem}
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: secret_api
                forward_client_cert_details: SANITIZE_SET
                set_current_client_cert_details: {uri: true}
                request_headers_to_remove: [x-verified-service-identity]
                request_headers_to_add:
                  - header:
                      key: x-verified-service-identity
                      value: "%DOWNSTREAM_PEER_URI_SAN%"
                    append_action: OVERWRITE_IF_EXISTS_OR_ADD
                route_config:
                  name: secret_api_route
                  virtual_hosts:
                    - name: secret_api
                      domains: ["*"]
                      routes:
                        - match: {prefix: /v1/secrets/resolve, path: /v1/secrets/resolve, methods: [POST]}
                          route: {cluster: broker_api}
                http_filters:
                  - name: envoy.filters.http.router
    - name: private_health
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8081
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: broker_health
                route_config:
                  name: health_route
                  virtual_hosts:
                    - name: health
                      domains: ["*"]
                      routes: [{match: {prefix: /health/}, route: {cluster: broker_health}}]
                http_filters: [{name: envoy.filters.http.router}]
  clusters:
    - name: broker_api
      connect_timeout: 2s
      type: STATIC
      load_assignment:
        cluster_name: broker_api
        endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: 127.0.0.1, port_value: 9001}}}}]}]
    - name: broker_health
      connect_timeout: 2s
      type: STATIC
      load_assignment:
        cluster_name: broker_health
        endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: 127.0.0.1, port_value: 8082}}}}]}]
admin:
  access_log_path: /dev/null
  address: {socket_address: {address: 127.0.0.1, port_value: 9901}}

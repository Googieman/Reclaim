# FS-001 credential inventory and audit rules.
version: credential-audit-v1.0.0
authority: vault-and-deployment-secret-manager
rules:
  repository_values: forbidden
  repository_files: references-only
  logs_and_traces: redacted-before-export
  replay_and_evaluation: no-merchant-credentials
  tenant_scope: every secret path includes tenant and connector identity
  action_credentials: only the isolated Action Gateway may read them
  credential_rotation: staged-versioned-reconciled-and-audited-out-of-band
  failure_mode: deny-before-connector-call
action_credentials:
  sole_principal: service-account-reclaim-action-gateway
  path_template: secret/data/tenants/{tenant_id}/connectors/{connector_id}/action
  required_audit_fields: [tenant_id, connector_id, principal, purpose, policy_version_id]
  forbidden_principals:
    - reclaim-web
    - reclaim-api
    - reclaim-event-relay
    - service-account-reclaim-workflow
    - service-account-reclaim-model-gateway
    - reclaim-evidence-connectors
    - reclaim-replay
    - reclaim-evaluation
observability:
  raw_evidence: false
  raw_prompts: false
  raw_outputs: false
  unnecessary_pii: false
  credentials_from_environment: false
residual_deployment_debt:
  - "Production secret-manager audit export and firewall enforcement remain deployment responsibilities."
  - "The n8n bootstrap never deletes a prior credential; operators revoke the old version only after reference verification."
  - "Compose carries the production mTLS, SASL, ACL, and principal-binding declarations; deployment operators must verify broker enforcement before activation."

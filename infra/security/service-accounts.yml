# FS-001 service-account and credential capability matrix.
version: service-accounts-v1.0.0
authority: postgresql-for-business-state; vault-for-secret-material
services:
  web:
    principal: reclaim-web
    credential_scopes: [api-public]
    action_connector_credentials: false
    merchant_mutation: false
  api:
    principal: reclaim-api
    credential_scopes: [postgresql-tenant-scoped, keycloak-verify, vault-webhook]
    action_connector_credentials: false
    merchant_mutation: false
  event-relay:
    principal: reclaim-event-relay
    broker_principal: reclaim-event-relay
    credential_scopes: [postgresql-tenant-scoped, redpanda-producer]
    action_connector_credentials: false
    merchant_mutation: false
  workflow-worker:
    principal: service-account-reclaim-workflow
    credential_scopes: [postgresql-tenant-scoped, temporal-worker, redpanda-consumer]
    action_connector_credentials: false
    merchant_mutation: false
  n8n-main:
    principal: reclaim-n8n-orchestrator
    broker_principal: reclaim-n8n-orchestrator
    credential_scopes: [redpanda-consumer, reclaim-api-only, n8n-schema-only]
    action_connector_credentials: false
    merchant_mutation: false
  n8n-worker:
    principal: reclaim-n8n-orchestrator
    broker_principal: null
    credential_scopes: [reclaim-api-only, n8n-schema-only, redis-queue-only]
    action_connector_credentials: false
    merchant_mutation: false
  model-gateway:
    principal: service-account-reclaim-model-gateway
    credential_scopes: [model-provider-if-qualified, redpanda-consumer]
    action_connector_credentials: false
    merchant_mutation: false
  attribution:
    principal: reclaim-attribution
    credential_scopes: [postgresql-read-only]
    action_connector_credentials: false
    merchant_mutation: false
  evidence-connectors:
    principal: reclaim-evidence-connectors
    credential_scopes: [evidence-provider-allowlist, postgresql-tenant-scoped]
    action_connector_credentials: false
    merchant_mutation: false
  action-gateway:
    principal: service-account-reclaim-action-gateway
    credential_scopes: [postgresql-tenant-scoped, action-connector-allowlist]
    action_connector_credentials: true
    merchant_mutation: true
  replay:
    principal: reclaim-replay
    credential_scopes: [postgresql-read-only, fixture-read-only]
    action_connector_credentials: false
    merchant_mutation: false
  evaluation:
    principal: reclaim-evaluation
    credential_scopes: [evaluation-store-read-write]
    action_connector_credentials: false
    merchant_mutation: false
action_credentials:
  sole_principal: service-account-reclaim-action-gateway
  vault_path_template: secret/data/tenants/{tenant_id}/connectors/{connector_id}/action
  allowed_connector_scope: merchant-controlled-action-allowlist
  forbidden_principals:
    - reclaim-web
    - reclaim-api
    - reclaim-event-relay
    - service-account-reclaim-workflow
    - reclaim-n8n-orchestrator
    - service-account-reclaim-model-gateway
    - reclaim-attribution
    - reclaim-evidence-connectors
    - reclaim-replay
    - reclaim-evaluation
